name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BINGO_REPOSITORY: https://github.com/yexrob/bingo.git
  BINGO_REVISION: 129cb528714865041db2202aad38e1e0d59d7eee

jobs:
  quality:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bingo Go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build application bundles
        run: npm run build

  package:
    name: Package ${{ matrix.label }}
    if: github.event_name != 'pull_request'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            artifact: bingo-go-windows-x64
            builder_args: --win nsis --x64 --publish never
          - label: macOS Intel
            runner: macos-15-intel
            artifact: bingo-go-macos-x64
            builder_args: --mac dmg zip --x64 --publish never
          - label: Linux x64
            runner: ubuntu-latest
            artifact: bingo-go-linux-x64
            builder_args: --linux AppImage deb --x64 --publish never
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout Bingo Go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare Bingo v0.4.0 protocol v1 source
        shell: bash
        run: |
          git clone --filter=blob:none "$BINGO_REPOSITORY" ../bingo
          git -C ../bingo checkout --detach "$BINGO_REVISION"
          test "$(git -C ../bingo rev-parse HEAD)" = "$BINGO_REVISION"
          git -C ../bingo apply --check "$GITHUB_WORKSPACE/vendor/bingo/v0.4.0-protocol-v1.patch"
          git -C ../bingo apply "$GITHUB_WORKSPACE/vendor/bingo/v0.4.0-protocol-v1.patch"
          git -C ../bingo diff --check
      - name: Build native Bingo runtime
        run: cargo build --manifest-path ../bingo/Cargo.toml --locked --release
      - name: Build Bingo Go
        run: npm run build
      - name: Prepare and probe native runtime
        run: npm run prepare:bingo
      - name: Build native packages
        run: npx electron-builder ${{ matrix.builder_args }}
      - name: Verify packaged runtime and targets
        run: node scripts/verify-packaged-runtime.mjs
      - name: Write SHA-256 checksums
        run: node scripts/write-artifact-checksums.mjs
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Bingo Go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Download native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bingo-go-*
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "Bingo Go $GITHUB_REF_NAME"
