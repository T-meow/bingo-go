appId: io.github.tmeow.bingogo
productName: Bingo Go
asar: true
npmRebuild: false
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin/win32-x64/bingo.exe
    to: bin/win32-x64/bingo.exe
  - from: build/icon.png
    to: icon.png
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES
win:
  icon: build/icon.ico
  executableName: bingo-go
  target:
    - target: dir
      arch:
        - x64
