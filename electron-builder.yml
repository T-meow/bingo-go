appId: io.github.tmeow.bingogo
productName: Bingo Go
asar: true
npmRebuild: false
electronDist: node_modules/electron/dist
directories:
  output: release
artifactName: Bingo-Go-${version}-${os}-${arch}.${ext}
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
  - from: build/icon.png
    to: icon.png
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES
win:
  icon: build/icon.ico
  executableName: bingo-go
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
    - target: zip
      arch:
        - x64
linux:
  icon: build/icon.png
  executableName: bingo-go
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
