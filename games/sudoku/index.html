<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数独</title>
  </head>
  <body>
    <main class="app">
      <header class="topbar"><div><h1>数独</h1><p id="status">进行中</p></div><span id="timer" class="status">00:00</span></header>
      <div class="toolbar">
        <label class="select-label">难度 <select id="difficulty"><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select></label>
        <button id="pause" type="button">暂停</button><button id="new-game" class="primary" type="button">新局</button>
      </div>
      <div class="board-wrap"><section id="board" class="board" role="grid" aria-label="数独棋盘"></section><button id="pause-cover" class="pause-cover" type="button">继续</button></div>
      <section id="number-pad" class="number-pad" aria-label="数字输入"></section>
      <div class="actions"><button id="notes" type="button" aria-pressed="false">笔记</button><button id="erase" type="button">清除</button><button id="undo" type="button">撤销</button><button id="redo" type="button">重做</button><button id="reset" type="button">重置</button></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
